[package]
name = "bitbasis"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["quantum", "simulation"]
categories = ["science", "simulation"]
description = "Bit-string basis manipulation for qubit simulation — a Rust port of BitBasis.jl"

[dependencies]
num-complex = "0.4"
smallvec = "1"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
