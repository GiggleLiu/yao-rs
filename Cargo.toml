[workspace]
members = ["yao-cli", "bitbasis"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/GiggleLiu/yao-rs"

[package]
name = "yao-rs"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
documentation = "https://docs.rs/yao-rs"
keywords = ["quantum", "simulation", "tensor-network", "autodiff"]
categories = ["science", "simulation"]
exclude = [".claude/", "docs/", "scripts/", "benchmarks/", "CLAUDE.md"]
description = "Quantum circuit simulation, tensor-network export, and SVG rendering — a Rust port of Yao.jl"

[features]
default = []
parallel = ["rayon"]
omeinsum = ["dep:omeinsum"]
tenferro = ["dep:tenferro-cpu", "dep:tenferro-tensor", "dep:tenferro-runtime", "dep:tenferro-einsum"]
tenferro-ad = ["tenferro", "dep:tenferro-ad"]
optimizer-example = ["tenferro-ad", "dep:argmin", "dep:argmin-math"]
qasm = ["dep:openqasm"]

[dependencies]
bitbasis = { path = "bitbasis", version = "0.1.0" }
num-complex = { version = "0.4", features = ["serde"] }
faer = "0.24"
ndarray = "0.17"
omeco = "0.2"
omeinsum = { version = "0.1", optional = true }
tenferro-cpu = { version = "=0.4.0", optional = true }
tenferro-tensor = { version = "=0.4.0", optional = true }
tenferro-runtime = { version = "=0.4.0", optional = true }
tenferro-einsum = { version = "=0.4.0", optional = true }
tenferro-ad = { version = "=0.4.0", optional = true }
argmin = { version = "0.11", default-features = false, optional = true }
argmin-math = { version = "0.5", default-features = false, features = ["vec"], optional = true }
rand = "0.10"
rayon = { version = "1.10", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
openqasm = { version = "0.1", optional = true }

[dev-dependencies]
approx = "0.5"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "apply"
harness = false

[[bench]]
name = "gates"
harness = false

[[bench]]
name = "qft"
harness = false

[[bench]]
name = "density"
harness = false

[[example]]
name = "circuit_svg"

[[example]]
name = "custom_loss"
required-features = ["optimizer-example"]

[package.metadata.docs.rs]
all-features = true

[[example]]
name = "sliced_expectation"
required-features = ["tenferro"]
