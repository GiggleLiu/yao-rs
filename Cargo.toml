[workspace]
members = ["yao-cli", "bitbasis"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/GiggleLiu/yao-rs"

[package]
name = "yao-rs"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Quantum circuit simulation, tensor-network export, and SVG rendering — a Rust port of Yao.jl"

[features]
default = []
parallel = ["rayon"]
omeinsum = ["dep:omeinsum"]
qasm = ["dep:openqasm"]

[dependencies]
bitbasis = { path = "bitbasis", version = "0.1.0" }
num-complex = { version = "0.4", features = ["serde"] }
faer = "0.24"
ndarray = "0.17"
omeco = "0.2"
omeinsum = { version = "0.1", optional = true }
rand = "0.10"
rayon = { version = "1.10", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
openqasm = { version = "0.1", optional = true }

[dev-dependencies]
approx = "0.5"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "apply"
harness = false

[[bench]]
name = "gates"
harness = false

[[bench]]
name = "qft"
harness = false

[[bench]]
name = "density"
harness = false

[[example]]
name = "circuit_svg"
