[workspace]

[package]
name = "yao-tenferro-probe"
version = "0.0.0"
edition = "2024"
rust-version = "1.96"
publish = false

[dependencies]
yao-rs = { path = "../..", features = ["omeinsum"] }
tenferro-tensor = "=0.4.0"
tenferro-cpu = "=0.4.0"
tenferro-runtime = "=0.4.0"
tenferro-einsum = { version = "=0.4.0", features = ["autodiff"] }
tenferro-ad = "=0.4.0"
num-complex = "0.4"
ndarray = "0.17"
omeco = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "backend"
harness = false
