name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # CUDA's optional dependency graph makes full debug symbols exceed small runners.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  benchmark-harness:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.10.2"
      - run: make benchmark-test

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo clippy --workspace --all-targets --no-default-features --locked -- -D warnings
      - run: cargo doc --workspace --no-deps --all-features --locked
        env:
          RUSTDOCFLAGS: -D warnings
      - run: python3 -m unittest discover -s scripts/tests

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        features: ["--all-features", "--no-default-features", "--no-default-features --features tenferro", "--no-default-features --features tenferro-ad"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked ${{ matrix.features }}
      - if: matrix.features == '--all-features'
        run: |
          cargo run --example custom_loss --all-features --locked
          cargo run --example sliced_expectation --all-features --locked
          cargo run --example noisy_trajectories --all-features --locked
          cargo run --example krylov_evolution --all-features --locked

  tenferro-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: benchmarks/tenferro-probe -> ../../target/probe
      - run: cargo fmt --manifest-path benchmarks/tenferro-probe/Cargo.toml -- --check
      - run: cargo clippy --manifest-path benchmarks/tenferro-probe/Cargo.toml --all-targets --all-features --locked -- -D warnings
      - run: cargo test --manifest-path benchmarks/tenferro-probe/Cargo.toml --all-features --locked
      - run: cargo run --manifest-path benchmarks/tenferro-probe/Cargo.toml --locked --bin cuda_cases -- /tmp/cuda-smoke.json --smoke
      - run: python3 -m unittest discover -s benchmarks/tests
      - name: Krylov benchmark smoke
        run: |
          cargo run --manifest-path benchmarks/tenferro-probe/Cargo.toml --locked --bin krylov_cases -- /tmp/krylov-smoke.json --smoke
          YAO_BENCH_CASES=/tmp/krylov-smoke.json YAO_BENCH_SUITE=krylov cargo bench --manifest-path benchmarks/tenferro-probe/Cargo.toml --locked --profile test --bench backend -- --test

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo package --workspace --locked

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install tarpaulin
        run: cargo install cargo-tarpaulin --locked
      - name: Generate coverage
        run: cargo tarpaulin --workspace --all-features --locked --engine llvm --out xml
      - name: Upload to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: cobertura.xml
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
